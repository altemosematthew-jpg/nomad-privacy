.sub{color:var(--ink-2);margin:6px 0 16px}
.list{border:2px solid var(--ink);border-radius:6px;padding:4px 14px;margin:16px 0}

.ht{font-weight:600}
.hv{grid-column:2 / 4;font-weight:600}
button{font:inherit;font-weight:700;font-size:15px;border:2px solid var(--ink);background:#fff;border-radius:6px;padding:6px 12px;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--magenta);outline-offset:2px}
.play{display:block;text-align:center;background:var(--magenta);color:#fff;text-decoration:none;font-weight:800;border:2px solid var(--ink);border-radius:6px;padding:14px;margin:20px 0;font-size:18px}
h2{font-size:21px;font-weight:800;margin-top:28px}
.foot{margin-top:36px;padding-top:14px;border-top:2px solid var(--ink);display:flex;flex-wrap:wrap;gap:6px 20px;font-size:15px;font-weight:600}
.foot a{color:var(--ink);text-decoration-thickness:2px;text-underline-offset:3px}
