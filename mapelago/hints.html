:root{--magenta:#b4237d;--ink:#000;--ink-2:#555b61;--rule:#e2eaee}
body{margin:0;background:#fff;color:var(--ink);font:400 17px/1.5 "Overpass","Helvetica Neue",Arial,sans-serif}
#app{max-width:560px;margin:0 auto;padding:24px 18px 48px}
.top{display:flex;align-items:center;gap:12px}
h1{font-size:30px;font-weight:800;font-style:italic;line-height:1.1;margin:0;letter-spacing:-.01em}
.sub{color:var(--ink-2);margin:6px 0 16px}
.list{border:2px solid var(--ink);border-radius:6px;padding:4px 14px;margin:16px 0}
.hint{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1.5px solid var(--rule)}
.hint:first-child{border-top:0}
.sw{width:36px;height:36px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:4px;font-weight:800;font-style:italic;font-size:14px}
.ht{font-weight:600}
.hv{grid-column:2 / 4;font-weight:600}
